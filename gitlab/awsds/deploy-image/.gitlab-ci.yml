# The pipeline of the GitLab project awsds/deploy-image (README.md).
#
# It builds this project's own commit on the build runner and pushes it to awsds-prod-ecr-deploy
# (AWS-DataScience's Stage 8 steps 3.1 and 4.3). Run from Build -> Pipelines -> Run pipeline on main
# with IMAGE_TAG set; the project lets only a maintainer pass it. The digest the job prints is what
# AWS-DataScience's terraform-live/production/runners/ pins.
stages: [build]

variables:
  BUILDKITD_FLAGS: --oci-worker-no-process-sandbox

build-deploy-image:
  stage: build
  # BuildKit rootless by digest, the release app-etl's pipeline pins (v0.34.0, read 2026-10-12).
  image:
    name: moby/buildkit:v0.34.0-rootless@sha256:65eca3c01cd1180c8f64565c4e3c5983af5145818b0e6fa863385d099eb73855
    entrypoint: [""]
  timeout: 30m
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $IMAGE_TAG
  before_script:
    - mkdir -p ~/.docker
    - printf '{"credHelpers":{"%s":"ecr-login"}}' "$ECR_REGISTRY" > ~/.docker/config.json
  script:
    - |
      set -eu
      echo "recipe $CI_COMMIT_SHA $CI_COMMIT_TIMESTAMP $CI_COMMIT_TITLE"
      proxy_args="--opt build-arg:http_proxy=$http_proxy --opt build-arg:https_proxy=$https_proxy --opt build-arg:HTTP_PROXY=$HTTP_PROXY --opt build-arg:HTTPS_PROXY=$HTTPS_PROXY --opt build-arg:no_proxy=$no_proxy --opt build-arg:NO_PROXY=$NO_PROXY"
      echo "== deploy: $ECR_REGISTRY/awsds-prod-ecr-deploy:$IMAGE_TAG, its base through the cache"
      buildctl-daemonless.sh build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=. \
        --opt build-arg:REGISTRY="$ECR_REGISTRY" \
        $proxy_args --opt label:org.opencontainers.image.revision="$CI_COMMIT_SHA" \
        --output type=image,name="$ECR_REGISTRY/awsds-prod-ecr-deploy:$IMAGE_TAG",push=true \
        --metadata-file deploy.json
      echo "== pushed"
      echo "deploy.json: $(grep -o '"containerimage.digest": *"[^"]*"' deploy.json)"

# The pipeline of the GitLab project awsds/dev-env (README.md, "Building them on the build runner").
#
# It builds this project's own commit: `base` with the distribution through the pull-through cache,
# `dev-env` FROM the base just pushed, then the trust smoke build FROM the new dev-env, discarded. Run
# from Build -> Pipelines -> Run pipeline on main with IMAGE_TAG set; SKIP_BASE=1 rebuilds dev-env alone
# on a base tag a failed run already pushed, since the repositories are tag-immutable. Stage 8 step 1's
# release chain replaces the web trigger with the protected release tag.
stages: [build]

variables:
  BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  SMD_CACHE_PREFIX: ecr-public/sagemaker/sagemaker-distribution

build-images:
  stage: build
  # BuildKit rootless by digest, the release app-etl's pipeline pins (v0.34.0, read 2026-10-12).
  image:
    name: moby/buildkit:v0.34.0-rootless@sha256:65eca3c01cd1180c8f64565c4e3c5983af5145818b0e6fa863385d099eb73855
    entrypoint: [""]
  timeout: 2h
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $IMAGE_TAG
  before_script:
    - mkdir -p ~/.docker
    - printf '{"credHelpers":{"%s":"ecr-login"}}' "$ECR_REGISTRY" > ~/.docker/config.json
  script:
    - |
      set -eu
      echo "recipe $CI_COMMIT_SHA $CI_COMMIT_TIMESTAMP $CI_COMMIT_TITLE"
      proxy_args="--opt build-arg:http_proxy=$http_proxy --opt build-arg:https_proxy=$https_proxy --opt build-arg:HTTP_PROXY=$HTTP_PROXY --opt build-arg:HTTPS_PROXY=$HTTPS_PROXY --opt build-arg:no_proxy=$no_proxy --opt build-arg:NO_PROXY=$NO_PROXY"
      revision="--opt label:org.opencontainers.image.revision=$CI_COMMIT_SHA"
      if [ "${SKIP_BASE:-0}" = "1" ]; then
        echo "== base: skipped (SKIP_BASE=1), $IMAGE_TAG is already in awsds-prod-ecr-base"
        echo '{}' > base.json
      else
        echo "== base: $ECR_REGISTRY/awsds-prod-ecr-base:$IMAGE_TAG, the distribution through the cache"
        buildctl-daemonless.sh build --frontend dockerfile.v0 \
          --local context=base --local dockerfile=base \
          --opt build-arg:SMD_IMAGE="$ECR_REGISTRY/$SMD_CACHE_PREFIX" \
          $proxy_args $revision \
          --output type=image,name="$ECR_REGISTRY/awsds-prod-ecr-base:$IMAGE_TAG",push=true \
          --metadata-file base.json
      fi
      echo "== dev-env: $ECR_REGISTRY/awsds-prod-ecr-dev-env:$IMAGE_TAG, FROM the base just pushed"
      buildctl-daemonless.sh build --frontend dockerfile.v0 \
        --local context=dev-env --local dockerfile=dev-env \
        --opt build-arg:BASE_IMAGE="$ECR_REGISTRY/awsds-prod-ecr-base" --opt build-arg:BASE_TAG="$IMAGE_TAG" \
        $proxy_args $revision \
        --output type=image,name="$ECR_REGISTRY/awsds-prod-ecr-dev-env:$IMAGE_TAG",push=true \
        --metadata-file dev-env.json
      echo "== smoke: the new dev-env reads gitlab.awsds.internal with curl, git and both Pythons"
      buildctl-daemonless.sh build --frontend dockerfile.v0 --no-cache \
        --local context=smoke --local dockerfile=smoke \
        --opt build-arg:DEV_ENV="$ECR_REGISTRY/awsds-prod-ecr-dev-env:$IMAGE_TAG" \
        $proxy_args
      echo "== pushed"
      for f in base.json dev-env.json; do echo "$f: $(grep -o '"containerimage.digest": *"[^"]*"' "$f")"; done

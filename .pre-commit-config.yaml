# Stage 2 steps 6.4 and 6.5.
#
# Install the git hook once per clone:  pre-commit install
# Run against everything:               pre-commit run --all-files
#
# terraform_validate runs `terraform init -backend=false` per slice, which is network- and
# disk-heavy the first time. Export TF_PLUGIN_CACHE_DIR (see terraform-live/README.md) so the
# provider is downloaded once for the whole tree instead of once per slice.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      # The image's managed-settings.json reaches /etc/claude-code/ by COPY, and Claude Code
      # IGNORES AN UNPARSEABLE ONE SILENTLY: every key in it stops applying and the session runs
      # on the client's own defaults, against api.anthropic.com. A trailing comma has to fail
      # here, in review, rather than in a space three weeks later (Stage 6e step 5.2).
      - id: check-json
        files: ^images/.*\.json$
      - id: check-added-large-files
        # The one file over 500 KB that belongs in git: images/dev-env/python/uv.lock, ~900 KB of
        # resolved hashes for 363 packages. It is the reproducibility of the image's Python
        # environment - the thing `uv sync --frozen` refuses to build without - so it is admitted by
        # name rather than by raising the limit for everything.
        exclude: ^images/dev-env/python/uv\.lock$
      # D36 puts the internal CA's root private key inside a Terraform state file. State is
      # gitignored (6.2), but this is the cheap second net for a key that arrives some other
      # way - a scratch .pem, a copied output, a paste into a .tf.
      - id: detect-private-key

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.108.1
    hooks:
      - id: terraform_fmt

      # -backend=false because a slice's backend is partial configuration + a gitignored
      # backend.hcl (2.5), and because validate must not need AWS credentials: a check that
      # only runs for someone holding a session is not a repository check.
      #
      # Three folders at a time. The hook's default is one per CPU less one: on an 11-core,
      # 18 GB laptop, `--all-files` ran ten at once and five module folders failed with
      # "Failed to load plugin schemas" in each of two runs (2026-10-12, AWS provider 6.68.0);
      # three at a time passed in 27 s with a warm plugin cache.
      - id: terraform_validate
        args:
          - --tf-init-args=-backend=false
          - --hook-config=--parallelism-limit=3

      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl

  # checkov is a REQUIRED gate, not an advisory one (6.5) - a policy check that can be skipped
  # is one that will be skipped on the day it would have mattered. Suppressions are inline
  # `# checkov:skip=CKV_... reason` on the resource, never a global exclusion here, so every
  # one of them is a line somebody wrote on purpose and a reviewer can see.
  #
  # `language: system` binds to the checkov on PATH - the uv-installed one recorded in
  # CLAUDE.md - rather than letting pre-commit build a second copy at a version nobody chose.
  - repo: local
    hooks:
      # -------------------------------------------------- the Python scripts' own gate
      # The repository's scripts are Python on the uv project in pyproject.toml
      # (2026-08-15), so they get the same treatment the Terraform tree gets: a linter and
      # a formatter, at the version the lock file pins (`uv run` binds to the project
      # environment, never to whatever ruff is on PATH).
      - id: ruff-check
        name: ruff (lint)
        entry: uv run --quiet ruff check
        language: system
        types: [python]

      - id: ruff-format
        name: ruff (format check)
        entry: uv run --quiet ruff format --check
        language: system
        types: [python]

      # ---------------------------------------------------------------- step 9's own checks
      # THE SAME SCRIPTS `make check` CALLS, and that is the point: a commit gate and a target
      # that disagree are two rules. The third caller is .github/workflows/offline-gates.yml
      # (Stage 8 step 6.2), which runs `pre-commit run --all-files` and `make check`. Step 9.3 is deliberately absent: it needs an SSO session,
      # and a commit gate that demands one is a gate nobody can run offline (`make check-ou`).
      - id: check-tf-conventions
        name: no region literals, indexed AZs or account-level BPA (9.1)
        entry: ./scripts/check-tf-conventions.py
        language: system
        pass_filenames: false
        files: \.tf$

      - id: check-iam-wildcards
        name: no wildcard-account ARN in the identity plane (9.2)
        entry: ./scripts/check-iam-wildcards.py
        language: system
        pass_filenames: false
        files: ^terraform-live/identity/.*\.(json|tf)$

      # 3.5 - the five bootstrap slices are one slice, copied. Step 2.3 rules out a module
      # (consumed by git tag, which cannot exist before the module does), so the copy's own
      # failure mode - a setting changed in four places out of five - needs an instrument.
      - id: check-bootstrap-parity
        name: the bootstrap slices are still copies of one another (3.5)
        entry: ./scripts/check-bootstrap-parity.py
        language: system
        pass_filenames: false
        files: ^terraform-live/[^/]+/bootstrap/

      # 8.1 - every slice on disk declares its D11 layer in scripts/tfhygiene/layers.py. The
      # direction that costs money is a slice with no row: `make down` skips it in silence,
      # and for an [E] slice that is a bill nobody is told about. It fires on any .tf under
      # terraform-live/ so that CREATING a slice trips it, not only editing the table.
      - id: check-slice-layers
        name: every slice declares its [P]/[D]/[E] layer (8.1)
        entry: ./scripts/slices.py check
        language: system
        pass_filenames: false
        files: ^(terraform-live/[^/]+/[^/]+/.*\.tf|scripts/tfhygiene/layers\.py)$

      # Stage 4's second design review (2026-08-16) - the WireGuard peers roster is a TRACKED
      # tfvars (public halves only), the one deliberate exception to "tfvars are never
      # committed". An exception without a shape check is how the host's private key ends up
      # on GitHub: WireGuard public and private keys are INDISTINGUISHABLE by format (44-char
      # base64), so the gate validates STRUCTURE - which keys a tracked tfvars may assign -
      # never content.
      - id: check-tfvars-shape
        name: tracked tfvars match their allowlisted shape (Stage 4)
        entry: ./scripts/check-tfvars-shape.py
        language: system
        pass_filenames: false
        files: (\.tfvars(\.json)?|scripts/check-tfvars-shape\.py)$

      # 9.4 - it already existed and was run by hand, which is exactly the state step 9 ends.
      # Once org-policies/ manages these documents, a statement added in Terraform with no row
      # in POLICIES.md is a control nobody can explain a year later.
      - id: check-policies-index
        name: POLICIES.md still describes policies/ (9.4)
        entry: ./scripts/check-index.py
        language: system
        pass_filenames: false
        files: ^terraform-live/identity/org-policies/(policies/.*\.json|POLICIES\.md)$

      # 2026-08-23 - docs/NETWORK.md is the ONE picture of the whole network, written to be read
      # INSTEAD of opening six slices, which is exactly what makes a stale copy expensive: a
      # reader who trusts it does not go and check. The `files` filter names EVERY slice and not
      # only the network ones on purpose - the failure this defends against is a NEW slice
      # (Stage 7's GitLab, Stage 9's targets, Stage 13's web tier) putting a host on the wire
      # with nothing saying the picture is now incomplete.
      - id: check-network-doc
        name: docs/NETWORK.md still describes the network the code builds
        entry: ./scripts/check-network-doc.py
        language: system
        pass_filenames: false
        files: ^(terraform-live/[^/]+/[^/]+/.*\.tf|terraform-modules/(vpc|vpc-egress|wireguard)/.*\.tf|scripts/tfhygiene/backend\.py|docs/NETWORK\.md)$

      # 2026-08-17 - no account id and no e-mail address in a tracked file (CLAUDE.md's upkeep
      # table, aws/INDEX.md rule 1). It carries NO `files` filter on purpose: the rule is about
      # what reaches git, and restricting it to the paths that leaked last time is how the next
      # leak arrives through a path nobody listed. Same argument as detect-private-key above -
      # both guard a mistake that a later commit cannot undo, only a rewritten history can.
      - id: check-identifiers
        name: no account id or e-mail address in a tracked file
        entry: ./scripts/check-identifiers.py
        language: system
        pass_filenames: false

      # 2026-08-21, from the Stage 6 plan review - Stage 2 step 6.3's requirement, which had
      # been held by attention alone and had already been missed in three slices. A committed
      # lock file with one platform in it fails `terraform init` outright on a Linux runner
      # under the TF_PLUGIN_CACHE_DIR this repository mandates, and silently rewrites itself
      # without the cache. It fires on versions.tf too, because the constraint and the lock are
      # one question: a slice whose constraint drifts resolves a different provider build.
      - id: check-provider-locks
        name: every lock file carries the three platforms (6.3)
        entry: ./scripts/check-provider-locks.py
        language: system
        pass_filenames: false
        files: (\.terraform\.lock\.hcl|versions\.tf)$

      # 2026-10-14 - EC2 takes a group or rule description from one character set, and `validate`
      # holds only the inline blocks and aws_security_group_rule to it. A refused description on
      # the group itself or on an aws_vpc_security_group_*_rule fails at apply, after the resources
      # ahead of it exist: sandbox/app/app-etl/'s first apply stopped there on an apostrophe. The
      # hook fires on the script and its HCL reader too, so a change to either runs before it lands.
      - id: check-sg-descriptions
        name: security group and rule descriptions EC2 accepts
        entry: ./scripts/check-sg-descriptions.py
        language: system
        pass_filenames: false
        files: (\.tf|scripts/check-sg-descriptions\.py|scripts/tfhygiene/hcl\.py)$

      - id: checkov
        name: checkov (terraform)
        entry: checkov
        language: system
        pass_filenames: false
        files: \.tf$
        args:
          - --quiet
          - --compact
          - --framework=terraform
          - --directory=terraform-live
          - --directory=terraform-modules

# Stage 2 steps 6.4 and 6.5.
#
# Install the git hook once per clone:  pre-commit install
# Run against everything:               pre-commit run --all-files
#
# terraform_validate runs `terraform init -backend=false` per slice, which is network- and
# disk-heavy the first time. Export TF_PLUGIN_CACHE_DIR (see terraform-live/README.md) so the
# provider is downloaded once for the whole tree instead of once per slice.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
      # D36 puts the internal CA's root private key inside a Terraform state file. State is
      # gitignored (6.2), but this is the cheap second net for a key that arrives some other
      # way - a scratch .pem, a copied output, a paste into a .tf.
      - id: detect-private-key

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.108.1
    hooks:
      - id: terraform_fmt

      # -backend=false because a slice's backend is partial configuration + a gitignored
      # backend.hcl (2.5), and because validate must not need AWS credentials: a check that
      # only runs for someone holding a session is not a repository check.
      - id: terraform_validate
        args:
          - --tf-init-args=-backend=false

      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl

  # checkov is a REQUIRED gate, not an advisory one (6.5) - a policy check that can be skipped
  # is one that will be skipped on the day it would have mattered. Suppressions are inline
  # `# checkov:skip=CKV_... reason` on the resource, never a global exclusion here, so every
  # one of them is a line somebody wrote on purpose and a reviewer can see.
  #
  # `language: system` binds to the checkov on PATH - the uv-installed one recorded in
  # CLAUDE.md - rather than letting pre-commit build a second copy at a version nobody chose.
  - repo: local
    hooks:
      # -------------------------------------------------- the Python scripts' own gate
      # The repository's scripts are Python on the uv project in pyproject.toml
      # (2026-08-15), so they get the same treatment the Terraform tree gets: a linter and
      # a formatter, at the version the lock file pins (`uv run` binds to the project
      # environment, never to whatever ruff is on PATH).
      - id: ruff-check
        name: ruff (lint)
        entry: uv run --quiet ruff check
        language: system
        types: [python]

      - id: ruff-format
        name: ruff (format check)
        entry: uv run --quiet ruff format --check
        language: system
        types: [python]

      # ---------------------------------------------------------------- step 9's own checks
      # THE SAME SCRIPTS `make check` CALLS, and that is the point: a commit gate and a target
      # that disagree are two rules. Stage 8 step 6 adds a third caller - .gitlab-ci.yml - and
      # it is a line, not a rewrite. Step 9.3 is deliberately absent: it needs an SSO session,
      # and a commit gate that demands one is a gate nobody can run offline (`make check-ou`).
      - id: check-tf-conventions
        name: no region literals, indexed AZs or account-level BPA (9.1)
        entry: ./scripts/check-tf-conventions.py
        language: system
        pass_filenames: false
        files: \.tf$

      - id: check-iam-wildcards
        name: no wildcard-account ARN in the identity plane (9.2)
        entry: ./scripts/check-iam-wildcards.py
        language: system
        pass_filenames: false
        files: ^terraform-live/identity/.*\.(json|tf)$

      # 9.4 - it already existed and was run by hand, which is exactly the state step 9 ends.
      # Once org-policies/ manages these documents, a statement added in Terraform with no row
      # in POLICIES.md is a control nobody can explain a year later.
      - id: check-policies-index
        name: POLICIES.md still describes policies/ (9.4)
        entry: ./terraform-live/identity/org-policies/check-index.py
        language: system
        pass_filenames: false
        files: ^terraform-live/identity/org-policies/(policies/.*\.json|POLICIES\.md)$

      - id: checkov
        name: checkov (terraform)
        entry: checkov
        language: system
        pass_filenames: false
        files: \.tf$
        args:
          - --quiet
          - --compact
          - --framework=terraform
          - --directory=terraform-live
          - --directory=terraform-modules

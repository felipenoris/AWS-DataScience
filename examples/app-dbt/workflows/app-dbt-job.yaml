# {"job":{"x":120,"y":200}}
app-dbt-job:
  dag_id: app-dbt-job
  tasks:
    # The infrastructure repository's Stage 20 step 4.5: one processing job on the house image, in the
    # project's subnets and security group, without network isolation, the template's other settings
    # as app-etl's `process` sends them. Its container holds the project role's credentials and runs
    # job/probe.py, which prints what the job reaches. No output: nothing is written but the log. The
    # workflow is the dev stage's alone and leaves the tree before pass 8's tag.
    job:
      operator: airflow.providers.amazon.aws.operators.sagemaker.SageMakerProcessingOperator
      retries: 0
      config:
        ProcessingJobName: "app-dbt-job-{{ macros.time.strftime('%Y%m%dT%H%M%S', macros.time.gmtime()) }}"
        RoleArn: "{proj.iam_role_arn}"
        AppSpecification:
          ImageUri: "{env.JOB_IMAGE_URI}"
          ContainerEntrypoint: [/opt/conda/bin/python, /opt/ml/processing/code/probe.py]
          ContainerArguments:
            - --region
            - "{domain.region}"
            - --workgroup
            - "{proj.connection.project.athena.workgroupName}"
            - --database
            - "{env.PRODUCT_DATABASE}"
            - --domain
            - "{domain.id}"
        ProcessingResources:
          ClusterConfig:
            InstanceCount: 1
            InstanceType: ml.t3.medium
            VolumeSizeInGB: 10
            VolumeKmsKeyId: "{env.PROJECT_KEY_ARN}"
        NetworkConfig:
          EnableNetworkIsolation: false
          EnableInterContainerTrafficEncryption: true
          VpcConfig:
            Subnets: ["{env.SUBNET_AZ1}", "{env.SUBNET_AZ2}"]
            SecurityGroupIds: ["{env.PROJECT_SG}"]
        ProcessingInputs:
          - InputName: code
            S3Input:
              S3Uri: "{proj.connection.default.s3_shared.s3Uri}app-dbt/job/"
              LocalPath: /opt/ml/processing/code
              S3DataType: S3Prefix
              S3InputMode: File
              S3DataDistributionType: FullyReplicated
        StoppingCondition:
          MaxRuntimeInSeconds: 900
        Tags:
          - Key: AmazonDataZoneProject
            Value: "{proj.id}"

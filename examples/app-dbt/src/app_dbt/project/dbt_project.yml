# The dbt project of app-dbt: two sources in the product database, the table trades the workflow's
# Glue task writes and the resource link trades_notional of the project's subscription, and a model
# built from each on Athena. run-dbt.sh copies this folder to a temporary one and runs dbt there, since
# dbt writes target/ and logs/ beside the project.
name: app_dbt
version: "0.1.0"
config-version: 2
profile: app_dbt

model-paths: ["models"]

# persist_docs writes each description into the Glue table, through the adapter's glue:UpdateTable.
models:
  app_dbt:
    +persist_docs:
      relation: true
      columns: true

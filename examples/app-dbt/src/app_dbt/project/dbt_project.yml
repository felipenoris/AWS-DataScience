# The dbt project of app-dbt: the product database's table trades as a source, written by the
# workflow's Glue task, and the model notional_by_desk built from it on Athena. run-dbt.sh copies this
# folder to a temporary one and runs dbt there, since dbt writes target/ and logs/ beside the project.
name: app_dbt
version: "0.1.0"
config-version: 2
profile: app_dbt

model-paths: ["models"]

# persist_docs writes each description into the Glue table, through the adapter's glue:UpdateTable.
models:
  app_dbt:
    +persist_docs:
      relation: true
      columns: true

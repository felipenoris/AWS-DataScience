# app-dbt's manifest (the infrastructure repository's Stage 20, decision 7): what the CI/CD CLI copies
# to the Sandbox project the application runs in, in the notation the CLI resolves. The storage items
# are a file or a folder of this tree, never a glob, which `bundle` (CLI 1.0.9) does not expand:
# `deploy` syncs each to the stage's `targetDirectory` under the project's shared prefix. A workflow's
# `code` is the worker's archive, which package-task builds before the deploy (README.md).
#
# One stage, `dev`, and no catalog block: the application is Sandbox's alone and carries no release
# (decision 9 (a)), and the project's own source imports the tables the workflow writes.
#
# A stage reads `${VAR}` from the shell, and the CLI refuses a manifest whose variable is unset or
# empty. Each `{env.VAR}` a workflow names is a stage variable: the CLI writes it into the deployed
# definition as a parameter and fills it on every run it starts, from the shell of that run, so a switch
# turned between two runs is an `export` and a run, never a deploy. A switch at rest holds a word,
# `default`, since an empty value is refused. PRODUCT_DATABASE is a literal: the database is created in
# the project before the first deploy, never by the application. ACCOUNT_ID is the account the lineage
# names; LINEAGE_DOMAIN the domain the transform task posts to; LINEAGE_NAMES `as-built` or `glue-arn`;
# LINEAGE_ENDPOINT a URL or `default`; LINEAGE_ATTEMPTS a number of attempts or `default`.
applicationName: app-dbt

content:
  storage:
    - name: code
      include:
        - code/app-dbt.zip
    - name: glue
      include:
        - "glue/"
      exclude:
        - __pycache__/
        - "*.pyc"
    - name: samples
      include:
        - "samples/"
    - name: workflows
      include:
        - "workflows/"
  workflows:
    - workflowName: app-dbt
      connectionName: default.workflow_serverless
      code: code/app-dbt.zip
    - workflowName: app-dbt-probe
      connectionName: default.workflow_serverless

stages:
  dev:
    stage: DEV
    domain:
      id: ${DOMAIN_ID}
      region: ${DOMAIN_REGION}
    project:
      name: ${DEV_PROJECT_NAME}
    environment_variables:
      SUBNET_AZ1: ${SUBNET_AZ1}
      SUBNET_AZ2: ${SUBNET_AZ2}
      ACCOUNT_ID: ${ACCOUNT_ID}
      PRODUCT_DATABASE: app_dbt
      ATHENA_WORKGROUP: ${ATHENA_WORKGROUP}
      LINEAGE_DOMAIN: ${LINEAGE_DOMAIN}
      LINEAGE_NAMES: ${LINEAGE_NAMES}
      LINEAGE_ENDPOINT: ${LINEAGE_ENDPOINT}
      LINEAGE_ATTEMPTS: ${LINEAGE_ATTEMPTS}
    bootstrap:
      actions:
        - type: workflow.create
          workflowName: app-dbt
        - type: workflow.create
          workflowName: app-dbt-probe
    deployment_configuration:
      storage:
        - name: code
          connectionName: default.s3_shared
          targetDirectory: app-dbt/code
        - name: glue
          connectionName: default.s3_shared
          targetDirectory: app-dbt/glue
        - name: samples
          connectionName: default.s3_shared
          targetDirectory: app-dbt/inbox
        - name: workflows
          connectionName: default.s3_shared
          targetDirectory: app-dbt/workflows

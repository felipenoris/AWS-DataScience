# app-etl's pipeline (Stage 8 steps 2.2 and 2.5), the application build pipeline the objectives name.
#
#   every push            the tests, ruff, the workflow lint and the gates (Secret Detection on branches,
#                         pip-audit)
#   the default branch    and the docs, published to Pages
#   a tag v<semver>       and the image: FROM base by digest, smoke-tested with networking off, pushed
#                         to awsds-prod-ecr-app-etl as v<semver>-<short sha>, then the scan gate; then
#                         the application: the worker's package built, the bundle for the `test` project
#                         built and deployed there with a run of the workflow, the bundle stored in
#                         awsds-prod-releases and the tag's GitLab release, which names it (D41,
#                         decisions 19 and 20); then the promotion (Stage 8 step 3): a manual gate into
#                         Staging (decision 28), Staging's egress read (the user raises it, decision 27),
#                         the application deployed from the bundle and run (nothing torn down: the user's
#                         `make down`), a manual gate, and Production, its egress read the same way;
#                         then three manual jobs of Production: the warehouse's DDL (Stage 9 9.4), and
#                         the model's registration and approval, which the batch transform follows
#                         (Stage 10 steps 5.2 and 5.4)
#
# Which runner takes which job (decision 11): every job extending .gates-uv carries tag awsds-test, the
# test runner, whose jobs hold no AWS identity. build-image, the scan gate, store-bundle and release are
# untagged, so only the build runner takes them, a protected runner that serves protected refs alone;
# test-deploy carries tag awsds-deploy, the deploy runner, and runs as awsds-deploy-sandbox-test
# (decision 19). The tag v* is protected, created by Maintainers only (step 2.1), which in CE is the
# whole of the release gate.

include:
  - project: awsds/ci-gates
    ref: d0b895c8159e655f6e4af83cc096e37993087c81 # gates-v0.6.0
    file: [/gates.gitlab-ci.yml, /baselines.gitlab-ci.yml]

stages: [test, build, verify, deploy, release, staging-gate, staging, gate, production]

variables:
  GATES_UV_PROJECTS: "."
  IMAGE_REPO: awsds-prod-ecr-app-etl
  # The workflow tooling, by commit: its lint reads manifest.yaml and workflows/ against the rules of
  # a SageMaker application (D28), offline; the promotion legs run its promoted lint and its lint-plan.
  AWSDS_WORKFLOWS: "awsds-workflows @ https://github.com/felipenoris/awsds-workflows/archive/d856982c0482de79916ce114662a37799936a6ee.zip"
  # The instance types a processing job may ask for: the ceiling DenySageMakerInstanceCeiling carries
  # in the Workloads SCP and in Sandbox's project boundary, the list terraform-modules/sagemaker-denies
  # holds (allowed_instance_types) in the infrastructure repository. A copy, since the application's
  # repository cannot read that module: a change to its list is a change here.
  LINT_INSTANCE_TYPES: "ml.t3.medium ml.t3.large ml.t3.xlarge ml.m5.large ml.m5.xlarge ml.c5.large ml.c5.xlarge"
  # The repositories of AWS's built-in algorithms a training task may name beside IMAGE_REPO, by
  # digest: XGBoost 3.0-5 (Stage 10 decision 21).
  LINT_ALGORITHM_REPOSITORIES: "sagemaker-xgboost"

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

test:
  extends: .gates-uv
  stage: test
  script:
    - uv sync --locked
    - uv run ruff check
    - uv run ruff format --check
    - uv run pytest
    # The lint with a job's two ceilings (Stage 8 step 5.6, clauses (e) and (f)): a literal ImageUri
    # or TrainingImage names IMAGE_REPO or one of LINT_ALGORITHM_REPOSITORIES, never the notebook
    # image, and an InstanceType is one of LINT_INSTANCE_TYPES. Without the options the lint reads
    # neither.
    - |
      set -eu
      set --
      for type in $LINT_INSTANCE_TYPES; do set -- "$@" --instance-type "$type"; done
      for repository in $LINT_ALGORITHM_REPOSITORIES; do set -- "$@" --algorithm-repository "$repository"; done
      uvx --from "$AWSDS_WORKFLOWS" awsds-workflows lint . --image-repository "$IMAGE_REPO" "$@"

pages:
  extends: .gates-uv
  stage: build
  script:
    - uv sync --locked
    - uv run pdoc app_etl --output-directory public
  pages: true
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# BuildKit rootless, as Stage 7's pipelines run it: v0.34.0, the release `rootless` named on 2026-10-12,
# by digest. Two builds share the job's cache: `smoke` first, which builds `app` and runs the job's command
# on it, then `app` itself, pushed. The digest goes to the scan gate and to test-deploy as a dotenv
# report. The job is not named `image`: at the top level that is the global keyword, and GitLab refuses
# the file.
build-image:
  stage: build
  image:
    name: moby/buildkit:v0.34.0-rootless@sha256:65eca3c01cd1180c8f64565c4e3c5983af5145818b0e6fa863385d099eb73855
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - |
      set -eu
      mkdir -p ~/.docker
      printf '{"credHelpers":{"%s":"ecr-login"}}' "$ECR_REGISTRY" > ~/.docker/config.json
      proxy_args="--opt build-arg:http_proxy=$http_proxy --opt build-arg:https_proxy=$https_proxy --opt build-arg:HTTP_PROXY=$HTTP_PROXY --opt build-arg:HTTPS_PROXY=$HTTPS_PROXY --opt build-arg:no_proxy=$no_proxy --opt build-arg:NO_PROXY=$NO_PROXY"
      ref="$ECR_REGISTRY/$IMAGE_REPO:$CI_COMMIT_TAG-$CI_COMMIT_SHORT_SHA"
      echo "== smoke: the job's command as the image's user, networking off, the output owned by root"
      buildctl-daemonless.sh build --frontend dockerfile.v0 --local context=. --local dockerfile=. \
        --opt target=smoke --opt build-arg:REGISTRY="$ECR_REGISTRY" $proxy_args
      echo "== push: $ref"
      buildctl-daemonless.sh build --frontend dockerfile.v0 --local context=. --local dockerfile=. \
        --opt target=app --opt build-arg:REGISTRY="$ECR_REGISTRY" $proxy_args \
        --opt label:org.opencontainers.image.revision="$CI_COMMIT_SHA" \
        --opt label:org.opencontainers.image.version="$CI_COMMIT_TAG" \
        --output type=image,name="$ref",push=true --metadata-file image.json
      digest="$(grep -o '"containerimage.digest": *"sha256:[0-9a-f]*"' image.json | grep -o 'sha256:[0-9a-f]*')"
      echo "SCAN_DIGEST=$digest" > image.env
      # The image by digest for test-deploy, whose deploy runner carries no ECR_REGISTRY.
      echo "JOB_IMAGE_URI=$ECR_REGISTRY/$IMAGE_REPO@$digest" >> image.env
      echo "== pushed $ref@$digest"
  artifacts:
    reports:
      dotenv: image.env

scan-gate:
  extends: .gates-ecr-scan
  stage: verify
  needs: [build-image]
  variables:
    SCAN_REPOSITORY: awsds-prod-ecr-app-etl
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# The workers' packages (D28 class 2b): the module of code/ alone, zipped once under each workflow's
# name, since it needs only the boto3 the MWAA Serverless worker carries and the orchestration slices
# pin code/<workflow>.zip. `bundle` builds nothing, so the zips are built here, into the folder the
# manifest includes, and each imported once on the worker's Python minor version.
build-task-code:
  extends: .gates-uv
  stage: build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - |
      set -eu
      for workflow in app-etl app-etl-train; do
        python3 -m zipfile -c "code/$workflow.zip" code/app_etl_tasks.py
        python3 -m zipfile -l "code/$workflow.zip"
        PYTHONPATH="code/$workflow.zip" python3 -c "import app_etl_tasks; print(app_etl_tasks.__file__)"
      done
  artifacts:
    paths: [code/app-etl.zip, code/app-etl-train.zip]

# The application in the `test` project (step 2.5, decision 19): the bundle built over the folders the
# manifest includes, failing on the warning `bundle` prints for a missing include, then `deploy`, which
# copies the folders, creates the workflow and runs it (`workflow.run` with `trailLogs`), the run read
# back by `get-workflow-run`. The job runs on the deploy runner as awsds-deploy-sandbox-test, the
# profile the runner's AWS config carries; its first calls are readings that fail in seconds when the
# hub or Sandbox's egress is down (verification xxiv). The `test` project's prefix is emptied before the
# deploy, so no file of an earlier release survives beside this one's (verification xxvi). The job's
# variables: DOMAIN_ID, DOMAIN_REGION, DEV_PROJECT_NAME, TEST_PROJECT_NAME, SUBNET_AZ1, SUBNET_AZ2,
# DEV_PROJECT_SG, TEST_PROJECT_SG, DEV_PROJECT_KEY_ARN, TEST_PROJECT_KEY_ARN, TEST_PROJECT_S3_URI and
# TRAINING_IMAGE_URI are CI/CD variables of the GitLab project, the last the XGBoost image by digest that
# sagemaker/'s output training_image_uri names; JOB_IMAGE_URI is the image build-image pushed, by digest,
# which the stage passes to the run. The deploy creates both workflows and runs app-etl alone.
test-deploy:
  stage: deploy
  needs: [build-image, build-task-code]
  tags: [awsds-deploy]
  resource_group: app-etl-test
  timeout: 45m
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  variables:
    AWS_PROFILE: awsds-deploy-sandbox-test
  script:
    - |
      set -eu
      for name in DOMAIN_ID DOMAIN_REGION DEV_PROJECT_NAME TEST_PROJECT_NAME SUBNET_AZ1 SUBNET_AZ2 DEV_PROJECT_SG TEST_PROJECT_SG DEV_PROJECT_KEY_ARN TEST_PROJECT_KEY_ARN TEST_PROJECT_S3_URI TRAINING_IMAGE_URI; do
        eval "value=\${$name:-}"
        if [ -z "$value" ]; then echo "FATAL: the CI/CD variable $name is not set"; exit 1; fi
      done
      if [ -z "${JOB_IMAGE_URI:-}" ]; then echo "FATAL: build-image's dotenv carries no JOB_IMAGE_URI"; exit 1; fi
      export JOB_IMAGE_URI
      echo "== the hub: the proxy answers for the SageMaker API"
      # VPC-SharedServices holds no SageMaker endpoint, so only the proxy answers; curl's failure stays
      # inside the substitution, since under `set -e` a failed assignment ends the job before the message.
      code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://sagemaker.$DOMAIN_REGION.amazonaws.com/" || true)"
      if [ "$code" = "000" ]; then echo "FATAL: no answer through the proxy: is the hub up (make hub-up)?"; exit 1; fi
      echo "== Sandbox's egress: the interface endpoints the run needs"
      for service in sagemaker.api glue logs; do
        state="$(aws ec2 describe-vpc-endpoints --filters "Name=service-name,Values=com.amazonaws.$DOMAIN_REGION.$service" "Name=vpc-endpoint-type,Values=Interface" --query 'VpcEndpoints[0].State' --output text)"
        echo "$service: $state"
        if [ "$state" != "available" ]; then echo "FATAL: no $service endpoint: is Sandbox's egress up (make up ENV=sandbox ONLY=egress)?"; exit 1; fi
      done
      echo "== the test project's prefix, emptied"
      aws s3 rm --recursive "${TEST_PROJECT_S3_URI%/}/app-etl/"
      echo "== bundle"
      aws-smus-cicd-cli bundle --manifest manifest.yaml --targets test > bundle.log 2>&1
      cat bundle.log
      if grep -q "Pattern not found" bundle.log; then echo "FATAL: an include of the manifest is missing"; exit 1; fi
      test -s artifacts/app-etl.zip
      sha256sum artifacts/app-etl.zip > artifacts/app-etl.zip.sha256
      cat artifacts/app-etl.zip.sha256
      echo "BUNDLE_SHA256=$(cut -d' ' -f1 artifacts/app-etl.zip.sha256)" > bundle.env
      echo "JOB_IMAGE_URI=$JOB_IMAGE_URI" >> bundle.env
      echo "== deploy to test: the folders copied, the workflow created and run"
      rc=0
      aws-smus-cicd-cli deploy --manifest manifest.yaml --targets test --skip-validation --no-events > deploy.log 2>&1 || rc=$?
      cat deploy.log
      # The CLI 1.0.9 prints each workflow it creates as "ARN: <arn>" and the run as "Workflow
      # triggered: <name> (run_id: <id>)". The manifest creates two workflows and runs one, so the ARN
      # is the one whose name the run line carries, never the last printed (refused 2026-10-24,
      # v0.4.0's job 375). sed, not grep: a missing line yields an empty value and the FATAL below,
      # where grep's exit status under the runner's pipefail would end the job before any message.
      name="$(sed -n 's/.*Workflow triggered: \([^ ]*\) (run_id: .*/\1/p' deploy.log | tail -1)"
      run_id="$(sed -n 's/.*Workflow triggered: [^ ]* (run_id: \([^)]*\)).*/\1/p' deploy.log | tail -1)"
      arn="$(sed -n "s/.*ARN: \(arn:[^ ]*:workflow\/${name:-none}-[^ ]*\).*/\1/p" deploy.log | tail -1)"
      echo "deploy: exit $rc, run $run_id of $arn"
      if [ -z "$arn" ] || [ -z "$run_id" ]; then echo "FATAL: deploy.log names no workflow ARN or run id"; exit 1; fi
      aws mwaa-serverless get-workflow-run --workflow-arn "$arn" --run-id "$run_id" --output json > run.json
      cat run.json
      if [ "$rc" -ne 0 ]; then echo "FATAL: the deploy or the run failed"; exit "$rc"; fi
      grep -q '"RunState": "SUCCESS"' run.json
  artifacts:
    paths: [artifacts/, bundle.log, deploy.log, run.json]
    reports:
      dotenv: bundle.env
    expire_in: 1 year

# The release's bundle (decision 20): the bytes `test` ran, checked against the SHA256 test-deploy
# computed, copied to awsds-prod-releases with the build runner's own role. The aws CLI image the scan
# gate uses, by digest.
store-bundle:
  stage: release
  needs: [test-deploy]
  image:
    name: public.ecr.aws/aws-cli/aws-cli:2.37.12@sha256:ce44b800602264c12298bbf3399055a4cefdb9ed4a098abe564afe26e7071bce
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - |
      set -eu
      echo "$BUNDLE_SHA256  artifacts/app-etl.zip" | sha256sum -c -
      object="s3://awsds-prod-releases/app-etl/$CI_COMMIT_TAG/app-etl.zip"
      aws s3 cp artifacts/app-etl.zip "$object"
      echo "BUNDLE_OBJECT=$object" > release.env
  artifacts:
    reports:
      dotenv: release.env

# The tag's GitLab release, whose notes name the bundle's object, its SHA256 and the image: what a leg
# of the promotion reads (Stage 10). The `release` keyword runs glab, which GitLab's own cli image
# carries, pinned by digest (v1.120.0, released 2026-09-29); a tag whose `test` failed gets no release.
# The runner evaluates the description inside double quotes, so the notes hold no backtick, which the
# shell would run as a command substitution. glab reaches GitLab's API over HTTPS and trusts what Go reads
# from SSL_CERT_DIR beside the image's own bundle: the CA root the runner mounts in every job
# (runbooks/gitlab.md §K), which the image's store does not hold (refused 2026-10-24, v0.3.0's job 280).
release:
  stage: release
  needs: [store-bundle, test-deploy, build-image]
  image: registry.gitlab.com/gitlab-org/cli:v1.120.0@sha256:ec2d1cd59b2343fe6270acf67d6ac92b56d9898c5e70cda6395fb617c7373812
  variables:
    SSL_CERT_DIR: /etc/gitlab-runner/certs
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - echo "release $CI_COMMIT_TAG, bundle $BUNDLE_OBJECT, sha256 $BUNDLE_SHA256, image $JOB_IMAGE_URI"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "app-etl $CI_COMMIT_TAG"
    description: |
      Bundle: $BUNDLE_OBJECT

      Bundle SHA256: $BUNDLE_SHA256

      Image: $JOB_IMAGE_URI

# Verification (xiii), run by hand: the pip-audit gate with the proxy variables removed. No route leaves
# VPC-SharedServices but the proxy, so the job must fail, and the time it takes says whether it failed or
# hung until the bound.
gate-without-proxy:
  extends: .gates-uv
  stage: verify
  rules:
    - if: $CI_COMMIT_BRANCH
      when: manual
  allow_failure: true
  script:
    - |
      set -u
      start=$(date +%s)
      rc=0
      env -u HTTP_PROXY -u HTTPS_PROXY -u http_proxy -u https_proxy timeout 300 \
        uvx --from pip-audit==2.10.1 pip-audit --version || rc=$?
      echo "without the proxy: exit $rc after $(( $(date +%s) - start )) s (124 is the 300 s bound)"
      [ "$rc" -ne 0 ]

# ------------------------------------------------------------------ the promotion (Stage 8 step 3)
#
# The legs run on the deploy runner, in its deploy image, each job cloning the infrastructure repository
# at its default branch with the job token and printing the commit it runs (decision 2): the slices, the
# render and the release job live there, never here. The job's AWS identity is the profile it names, one
# per deploy role on the runner; every account value is read at run time from the slice that owns it.
# The deploy runner reaches every AWS service VPC-SharedServices holds no endpoint for through the proxy,
# and STS and the other services of that VPC's endpoints directly, its NO_PROXY naming them. So each job
# checks the proxy first on the SageMaker API, which that VPC holds no endpoint for (step 3.1, Stage 7
# decision 9), with curl's failure kept inside the substitution: under `set -e` a failed assignment ends
# the job before the message.
# The clone trusts the CA root the runner mounts in every job (runbooks/gitlab.md §K), which the deploy
# image's own store does not hold (refused 2026-10-24, v0.3.0's job 281).
.promotion:
  tags: [awsds-deploy]
  timeout: 45m
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  variables:
    INFRA_DIR: $CI_PROJECT_DIR/infrastructure
  before_script:
    - |
      set -eu
      code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://sagemaker.$DOMAIN_REGION.amazonaws.com/" || true)"
      if [ "$code" = "000" ]; then echo "FATAL: no answer through the proxy: is the hub up (make hub-up)?"; exit 1; fi
      echo "the proxy answers ($code)"
      git -c http.sslCAInfo=/etc/gitlab-runner/certs/ca.crt clone --quiet --depth 1 "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/awsds/infrastructure.git" "$INFRA_DIR"
      echo "awsds/infrastructure at $(git -C "$INFRA_DIR" rev-parse HEAD)"

# The staging gate (decision 28): a blocking manual job between the release and the Staging leg, the
# shape of production-gate. Its needs name the release's jobs, never `needs: []`, which would let it
# start past a failed one; who may start it is whoever may run the protected tag's pipeline (step 2.1).
# The leg writes into Staging and runs its jobs, so nothing of it starts before the gate.
staging-gate:
  stage: staging-gate
  needs: [release, store-bundle, test-deploy]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual
  allow_failure: false
  resource_group: staging
  script:
    - echo "$CI_COMMIT_TAG admitted to Staging by $GITLAB_USER_LOGIN"

# 3.1: Staging's [E] egress/, its interface endpoints and DNS Firewall, read before the leg writes and
# never raised: every shared slice is the user's `make up` / `make down` (decision 27). check-egress.py
# reads the slice's state and asks EC2 and Route 53 Resolver whether every endpoint it holds is
# available and its DNS Firewall association complete; a slice that is down fails the job with the
# command and the identity that raise it.
staging-check:
  extends: .promotion
  stage: staging
  needs: [staging-gate]
  resource_group: staging
  script:
    - |
      set -eu
      cd "$INFRA_DIR"
      AWS_PROFILE=awsds-deploy-staging ./scripts/check-egress.py staging egress

# 3.2: the bundle read as the runner's own role (decision 20) and checked before a file of it is read;
# the release job lints each rendered workflow in the promoted mode (Stage 10 step 2.3, with the
# pipeline's AWSDS_WORKFLOWS, IMAGE_REPO and LINT_INSTANCE_TYPES) and writes the bundle's tree into
# Staging's outputs bucket (Stage 10 step 2.4); then the application slice and the orchestration slice,
# each with the release this pipeline promotes. The application slice applies the plan it saved once
# lint-plan has read its Glue job under the release's glue/ folder (Stage 10 step 2.3, rule (2c)); the
# plan and its JSON carry state, so they stay in the job's temporary folder and are never an artifact.
# The orchestration slice's release file is kept as an artifact: its VersionIds are what step 3.7
# records as Staging's release.tf defaults. The artifact sits beside the clone, never inside it: a job
# that downloads it before cloning the mirror into infrastructure/ finds that folder not empty (refused
# 2026-10-24, v0.3.2's job 325).
staging-deploy:
  extends: .promotion
  stage: staging
  needs: [staging-check, test-deploy, store-bundle]
  resource_group: staging
  script:
    - |
      set -eu
      cd "$INFRA_DIR"
      AWS_PROFILE=awsds-prod-runner-deploy aws s3 cp "$BUNDLE_OBJECT" bundle.zip --only-show-errors
      echo "$BUNDLE_SHA256  bundle.zip" | sha256sum -c -
      export AWS_PROFILE=awsds-deploy-staging
      ./scripts/release-application.py staging --bundle bundle.zip --sha256 "$BUNDLE_SHA256" --tag "$CI_COMMIT_TAG" --image-uri "$JOB_IMAGE_URI" --lint --release-vars terraform-live/staging/orchestration/release.auto.tfvars.json
      printf '{"release": {"tag": "%s", "digest": "%s", "bundle_sha256": "%s"}}\n' "$CI_COMMIT_TAG" "${JOB_IMAGE_URI##*@}" "$BUNDLE_SHA256" > terraform-live/staging/app/app-etl/release.auto.tfvars.json
      for slice in app/app-etl orchestration; do
        ./scripts/gen-backend-hcl.py staging "$slice"
        ./scripts/gen-tfvars.py --pipeline staging "$slice"
        terraform -chdir="terraform-live/staging/$slice" init -backend-config=backend.hcl -input=false
      done
      plans="$(mktemp -d)"
      terraform -chdir=terraform-live/staging/app/app-etl plan -input=false -out="$plans/app-etl.tfplan"
      terraform -chdir=terraform-live/staging/app/app-etl show -json "$plans/app-etl.tfplan" > "$plans/app-etl.json"
      ./scripts/lint-plan.py staging "$plans/app-etl.json" --tag "$CI_COMMIT_TAG"
      terraform -chdir=terraform-live/staging/app/app-etl apply -input=false "$plans/app-etl.tfplan"
      terraform -chdir=terraform-live/staging/orchestration apply -input=false -auto-approve
      cp terraform-live/staging/orchestration/release.auto.tfvars.json "$CI_PROJECT_DIR/staging-release.auto.tfvars.json"
      cat "$CI_PROJECT_DIR/staging-release.auto.tfvars.json"
  artifacts:
    paths: [staging-release.auto.tfvars.json]
    expire_in: 1 year

# 3.3: the deployed artifact run in the account, each chain's machine started by the leg and followed to
# its end (Stage 10 decision 19), the schedules being DISABLED in Staging: app-etl first, whose Glue job
# reads the governed table through Staging's share and writes the application's table, read back (Stage
# 9 8.5), and the training sets; then app-etl-train, which trains on those sets (Stage 10 step 5.1, the
# retraining Stage 9 decision 1 leaves Staging, decision 22). The application's table is read back by the
# deploy role too, which holds DESCRIBE on app_outputs' tables.
staging-test:
  extends: .promotion
  stage: staging
  needs: [staging-deploy]
  resource_group: staging
  script:
    - |
      set -eu
      export AWS_PROFILE=awsds-deploy-staging
      account="$(aws sts get-caller-identity --query Account --output text)"
      for chain in app-etl app-etl-train; do
        machine="arn:aws:states:$DOMAIN_REGION:$account:stateMachine:awsds-staging-chain-$chain"
        execution="$(aws stepfunctions start-execution --state-machine-arn "$machine" --name "$(echo "$CI_COMMIT_TAG-$CI_PIPELINE_ID-$chain" | tr . -)" --query executionArn --output text)"
        echo "started $execution"
        status=RUNNING
        while [ "$status" = "RUNNING" ]; do
          sleep 60
          status="$(aws stepfunctions describe-execution --execution-arn "$execution" --query status --output text)"
          echo "$(date -u +%H:%M:%S) $chain $status"
        done
        aws stepfunctions describe-execution --execution-arn "$execution" --output json > "execution-$chain.json"
        if [ "$status" != "SUCCEEDED" ]; then
          aws stepfunctions get-execution-history --execution-arn "$execution" --reverse-order --max-items 20 --output json > "history-$chain.json"
          echo "FATAL: the chain $chain ended $status"; cat "history-$chain.json"; exit 1
        fi
      done
      aws glue get-table --database-name app_outputs --name trades_notional --query 'Table.[Name,StorageDescriptor.Location]' --output text
  artifacts:
    when: always
    paths: [execution-*.json, history-*.json]
    expire_in: 1 year

# 5.4's Staging half: the model app-etl-train trained in this account served by a batch transform on the
# batch input the Glue job wrote, the predictions counted against the rows the evaluation recorded, the
# model deleted after (scripts/model-chain.py, which reads every account value from its slice's state).
staging-model:
  extends: .promotion
  stage: staging
  needs: [staging-test]
  resource_group: staging
  script:
    - |
      set -eu
      cd "$INFRA_DIR"
      AWS_PROFILE=awsds-deploy-staging ./scripts/model-chain.py transform staging --tag "$CI_COMMIT_TAG"

# 3.4 is retired (decision 27): the pipeline destroys nothing in Staging, as in Production. The
# application and orchestration slices hold the last release at rest, billing nothing, and the user's
# `make down ENV=staging` takes them down with egress/.

# 3.5: Production's plan of the application slice, read beside Staging's results before the gate, and
# lint-plan on it, so a refusal stops the pipeline before the gate asks anyone to approve.
production-plan:
  extends: .promotion
  stage: gate
  needs: [staging-test, staging-model, test-deploy]
  resource_group: production
  script:
    - |
      set -eu
      cd "$INFRA_DIR"
      export AWS_PROFILE=awsds-deploy-prod
      printf '{"release": {"tag": "%s", "digest": "%s", "bundle_sha256": "%s"}}\n' "$CI_COMMIT_TAG" "${JOB_IMAGE_URI##*@}" "$BUNDLE_SHA256" > terraform-live/production/app/app-etl/release.auto.tfvars.json
      ./scripts/gen-backend-hcl.py production app/app-etl
      ./scripts/gen-tfvars.py --pipeline production app/app-etl
      terraform -chdir=terraform-live/production/app/app-etl init -backend-config=backend.hcl -input=false
      plans="$(mktemp -d)"
      terraform -chdir=terraform-live/production/app/app-etl plan -input=false -no-color -out="$plans/app-etl.tfplan" > "$CI_PROJECT_DIR/production-plan.txt"
      cat "$CI_PROJECT_DIR/production-plan.txt"
      terraform -chdir=terraform-live/production/app/app-etl show -json "$plans/app-etl.tfplan" > "$plans/app-etl.json"
      ./scripts/lint-plan.py production "$plans/app-etl.json" --tag "$CI_COMMIT_TAG"
  artifacts:
    paths: [production-plan.txt]
    expire_in: 1 year

# 3.5: the gate, a blocking manual job whose needs name the Staging leg's jobs, never `needs: []`,
# which would let it start past a failed leg. Who may start a release is the protected tag (step 2.1).
production-gate:
  stage: gate
  needs: [staging-test, staging-model, production-plan]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual
  allow_failure: false
  resource_group: production
  script:
    - echo "$CI_COMMIT_TAG promoted by $GITLAB_USER_LOGIN"

# 3.6: the same bundle and image by digest, nothing rebuilt; named slices only, never `make up` or
# `make down ENV=production`. A Production run needs production/workloads-egress/ raised by the user,
# which the job reads first, as staging-check reads Staging's (decision 27), and never raises.
# The application slice applies a plan of its own, linted as Staging's: 3.5's plan is read, never applied.
production-deploy:
  extends: .promotion
  stage: production
  needs: [production-gate, test-deploy, store-bundle]
  resource_group: production
  script:
    - |
      set -eu
      cd "$INFRA_DIR"
      AWS_PROFILE=awsds-deploy-prod ./scripts/check-egress.py production workloads-egress
      AWS_PROFILE=awsds-prod-runner-deploy aws s3 cp "$BUNDLE_OBJECT" bundle.zip --only-show-errors
      echo "$BUNDLE_SHA256  bundle.zip" | sha256sum -c -
      export AWS_PROFILE=awsds-deploy-prod
      ./scripts/release-application.py production --bundle bundle.zip --sha256 "$BUNDLE_SHA256" --tag "$CI_COMMIT_TAG" --image-uri "$JOB_IMAGE_URI" --lint --release-vars terraform-live/production/orchestration/release.auto.tfvars.json
      printf '{"release": {"tag": "%s", "digest": "%s", "bundle_sha256": "%s"}}\n' "$CI_COMMIT_TAG" "${JOB_IMAGE_URI##*@}" "$BUNDLE_SHA256" > terraform-live/production/app/app-etl/release.auto.tfvars.json
      for slice in app/app-etl orchestration; do
        ./scripts/gen-backend-hcl.py production "$slice"
        ./scripts/gen-tfvars.py --pipeline production "$slice"
        terraform -chdir="terraform-live/production/$slice" init -backend-config=backend.hcl -input=false
      done
      plans="$(mktemp -d)"
      terraform -chdir=terraform-live/production/app/app-etl plan -input=false -out="$plans/app-etl.tfplan"
      terraform -chdir=terraform-live/production/app/app-etl show -json "$plans/app-etl.tfplan" > "$plans/app-etl.json"
      ./scripts/lint-plan.py production "$plans/app-etl.json" --tag "$CI_COMMIT_TAG"
      terraform -chdir=terraform-live/production/app/app-etl apply -input=false "$plans/app-etl.tfplan"
      terraform -chdir=terraform-live/production/orchestration apply -input=false -auto-approve
      cp terraform-live/production/orchestration/release.auto.tfvars.json "$CI_PROJECT_DIR/production-release.auto.tfvars.json"
      cat "$CI_PROJECT_DIR/production-release.auto.tfvars.json"
  artifacts:
    paths: [production-release.auto.tfvars.json]
    expire_in: 1 year

# Stage 9 step 9.4: the warehouse's DDL, warehouse/trades.sql, through the Data API as awsds-deploy-prod,
# whose database user creates the table and owns it (Stage 9 decision 6). Manual and allowed to fail,
# since the compute is raised and taken down by hand (`make up ENV=production
# ONLY=workloads-egress,warehouse-compute GROUPS=redshift`): a release whose leg ran with the compute down
# completes, and this job runs once it is up. Each statement is followed with a pause between reads,
# since the API has no waiter, and cancelled past its bound, since the Data API does not cancel a
# statement its client stops reading (verification xxvii). The statement is idempotent, so a second
# release runs it again (verification xxii).
production-warehouse-ddl:
  extends: .promotion
  stage: production
  needs: [production-deploy]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual
  allow_failure: true
  resource_group: production
  script:
    - |
      set -eu
      export AWS_PROFILE=awsds-deploy-prod
      run_sql() {
        id="$(aws redshift-data execute-statement --workgroup-name awsds-prod-warehouse --database governed --sql "$1" --query Id --output text)"
        deadline=$(( $(date +%s) + 300 ))
        while :; do
          sleep 5
          status="$(aws redshift-data describe-statement --id "$id" --query Status --output text)"
          case "$status" in
            FINISHED) echo "$id FINISHED"; return 0 ;;
            FAILED|ABORTED) echo "$id $status: $(aws redshift-data describe-statement --id "$id" --query Error --output text)"; return 1 ;;
          esac
          if [ "$(date +%s)" -ge "$deadline" ]; then
            aws redshift-data cancel-statement --id "$id" --output text
            sleep 5
            echo "$id cancelled after 300 s, now $(aws redshift-data describe-statement --id "$id" --query Status --output text)"
            return 1
          fi
        done
      }
      run_sql "$(cat warehouse/trades.sql)"
      run_sql "SELECT current_user, count(*) FROM trades.trades_notional"
      aws redshift-data get-statement-result --id "$id" --query 'Records[0][*]' --output text

# Stage 10 step 5.2: the newest completed training job of app-etl-train in Production registered in
# awsds-prod-model-app-etl as PendingManualApproval, with its evaluation as the version's ModelMetrics and
# the tag in its CustomerMetadataProperties. Manual, since the job runs out of the pipeline, started by
# the chain's schedule or by the operator; the version's ARN passes to the next two jobs.
production-register:
  extends: .promotion
  stage: production
  needs: [production-deploy]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual
  allow_failure: false
  resource_group: production
  script:
    - |
      set -eu
      cd "$INFRA_DIR"
      AWS_PROFILE=awsds-deploy-prod ./scripts/model-chain.py register --tag "$CI_COMMIT_TAG" --dotenv "$CI_PROJECT_DIR/model.env"
  artifacts:
    reports:
      dotenv: model.env

# 5.2's approval: a blocking manual job, the deployment manager's pause, CE's shape of Stage 8 3.5.
production-approve:
  extends: .promotion
  stage: production
  needs: [production-register]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual
  allow_failure: false
  resource_group: production
  script:
    - |
      set -eu
      cd "$INFRA_DIR"
      AWS_PROFILE=awsds-deploy-prod ./scripts/model-chain.py approve --package-arn "$MODEL_PACKAGE_ARN" --approver "$GITLAB_USER_LOGIN"

# 5.4's Production half: the approved version served by a batch transform, as Staging's model was.
production-transform:
  extends: .promotion
  stage: production
  needs: [production-approve, production-register]
  resource_group: production
  script:
    - |
      set -eu
      cd "$INFRA_DIR"
      AWS_PROFILE=awsds-deploy-prod ./scripts/model-chain.py transform production --tag "$CI_COMMIT_TAG" --package-arn "$MODEL_PACKAGE_ARN"

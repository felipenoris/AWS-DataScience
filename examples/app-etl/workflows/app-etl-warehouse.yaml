# {"load":{"x":120,"y":200}}
app-etl-warehouse:
  dag_id: app-etl-warehouse
  tasks:
    load:
      operator: airflow.providers.amazon.aws.operators.glue.GlueJobOperator
      job_name: app-etl-load-{proj.id}
      job_desc: The warehouse load of the application app-etl, created and updated by the workflow
      script_location: "{proj.connection.default.s3_shared.s3Uri}app-etl/glue/load_warehouse.py"
      iam_role_arn: "{proj.iam_role_arn}"
      region_name: "{domain.region}"
      update_config: true
      # The governed warehouse's names are Production's: the `prod` stage alone creates this workflow.
      script_args:
        "--TABLE_DATABASE": "{env.PRODUCT_DATABASE}"
        "--TABLE_NAME": trades_notional
        "--WORKGROUP": awsds-prod-warehouse
        "--DATABASE": governed
        "--TARGET_TABLE": trades.trades_notional
      create_job_kwargs:
        Command:
          Name: glueetl
          ScriptLocation: "{proj.connection.default.s3_shared.s3Uri}app-etl/glue/load_warehouse.py"
          PythonVersion: "3"
        GlueVersion: "6.0"
        WorkerType: G.1X
        NumberOfWorkers: 2
        Timeout: 20
        Connections:
          Connections:
            - datazone-glue-network-connection-{env.SUBNET_AZ1}-{proj.id}-dev
            - datazone-glue-network-connection-{env.SUBNET_AZ2}-{proj.id}-dev
        DefaultArguments:
          "--custom-logGroup-prefix": datazone-{proj.id}-dev
          "--datalake-formats": iceberg
          # The Iceberg catalog the product table is read through, as app-etl's job writes it.
          "--conf": "spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions --conf spark.sql.catalog.glue_catalog=org.apache.iceberg.spark.SparkCatalog --conf spark.sql.catalog.glue_catalog.catalog-impl=org.apache.iceberg.aws.glue.GlueCatalog --conf spark.sql.catalog.glue_catalog.io-impl=org.apache.iceberg.aws.s3.S3FileIO --conf spark.sql.catalog.glue_catalog.warehouse={proj.connection.default.s3_shared.s3Uri}app-etl/tables/"
        Tags:
          AmazonDataZoneProject: "{proj.id}"
      retries: 0

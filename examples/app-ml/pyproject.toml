# app-ml - the second application on the template conventions §6 describes (Stage 17 pass 9): a churn
# model trained in the `dev` project, carried by a release's bundle, and registered, approved and served
# in each target.
#
# Python 3.12, base's interpreter, as app-etl. The project has no runtime dependency: `app_ml.prepare`,
# the processing jobs' command, runs on the standard library, so the image adds nothing to base. The
# worker's tasks are the project in code/, with a lock of its own, so the MLflow client the track task
# runs reaches the worker's archive and never the image. The dev group holds the development tools and
# the boto3 and botocore the MWAA Serverless worker carries (1.43.1), whose service model the tests'
# Stubber checks each request against.

[project]
name = "app-ml"
version = "0.1.0"
description = "A churn table becomes XGBoost's training and scoring sets"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["boto3==1.43.1", "botocore==1.43.1", "pdoc>=15", "pytest>=8", "ruff>=0.12"]

# The resolver sees nothing published after this instant, so a release reaches the image no sooner than two
# weeks after it appears: the delay the infrastructure repository gives an action it pins. Moved forward
# deliberately, with `uv lock --upgrade` in the same commit, and in code/pyproject.toml with it.
[tool.uv]
exclude-newer = "2026-11-03T00:00:00Z"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_ml"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "code"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "code"]

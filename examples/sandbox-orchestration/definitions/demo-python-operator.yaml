# {"wait_for_file":{"x":120,"y":200},"run_project":{"x":420,"y":200}}
demo-python-operator:
  dag_id: demo-python-operator
  is_paused_upon_creation: false
  tasks:
    wait_for_file:
      operator: airflow.providers.amazon.aws.sensors.s3.S3KeySensor
      bucket_key: >-
        s3://<PROJECTS_BUCKET>/<DEMO_PREFIX>/python/inbox/?*
      wildcard_match: true
      poke_interval: 30
      timeout: 600
      soft_fail: true
      retries: 0
    run_project:
      dependencies:
        - wait_for_file
      operator: airflow.providers.standard.operators.python.PythonOperator
      python_callable: demo_tasks.run
      op_kwargs:
        bucket: <PROJECTS_BUCKET>
        inbox: >-
          <DEMO_PREFIX>/python/inbox/
        outbox: >-
          <DEMO_PREFIX>/python/outbox/
      retries: 0

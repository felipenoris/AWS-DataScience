# {"wait_for_file":{"x":120,"y":200},"run_command":{"x":420,"y":200},"reach_pypi":{"x":720,"y":200}}
demo-bash-operator:
  dag_id: demo-bash-operator
  description: Stage 6i pass 5
  is_paused_upon_creation: false
  tasks:
    wait_for_file:
      operator: airflow.providers.amazon.aws.sensors.s3.S3KeySensor
      bucket_key: >-
        s3://<PROJECTS_BUCKET>/<DEMO_PREFIX>/bash/inbox/?*
      wildcard_match: true
      poke_interval: 30
      timeout: 600
      soft_fail: true
      retries: 0
    run_command:
      dependencies:
        - wait_for_file
      operator: airflow.providers.standard.operators.bash.BashOperator
      bash_command: >-
        echo "cwd $(pwd) PYTHONPATH=${PYTHONPATH:-}" && cd
        /usr/local/airflow/dags && python3 -m awsds_demo_job.s3 --bucket
        <PROJECTS_BUCKET> --inbox
        <DEMO_PREFIX>/bash/inbox/
        --outbox
        <DEMO_PREFIX>/bash/outbox/
      retries: 0
    reach_pypi:
      dependencies:
        - run_command
      operator: airflow.providers.standard.operators.bash.BashOperator
      bash_command: reach_pypi.sh
      retries: 0

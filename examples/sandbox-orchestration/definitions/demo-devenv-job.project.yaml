# {"wait_for_file":{"x":120,"y":200},"run_project":{"x":420,"y":200},"remove_source":{"x":720,"y":200}}
demo-devenv-job:
  dag_id: demo-devenv-job
  is_paused_upon_creation: false
  tasks:
    wait_for_file:
      operator: airflow.providers.amazon.aws.sensors.s3.S3KeySensor
      bucket_key: >-
        s3://<PROJECTS_BUCKET>/<DEMO_PREFIX>/devenv/inbox/*
      wildcard_match: true
      poke_interval: 30
      timeout: 600
      soft_fail: true
      retries: 0
    run_project:
      dependencies:
        - wait_for_file
      operator: >-
        airflow.providers.amazon.aws.operators.sagemaker.SageMakerProcessingOperator
      retries: 0
      config:
        ProcessingJobName: >-
          demo-devenv-{{ macros.time.strftime('%Y%m%dT%H%M%S',
          macros.time.gmtime()) }}
        ProcessingInputs:
          - InputName: code
            S3Input:
              S3Uri: >-
                s3://<PROJECTS_BUCKET>/<DOMAIN_ID>/<PROJECT_ID>/shared/awsds-demo-job/
              LocalPath: /opt/ml/processing/code
              S3DataType: S3Prefix
              S3InputMode: File
              S3DataDistributionType: FullyReplicated
          - InputName: inbox
            S3Input:
              S3Uri: >-
                s3://<PROJECTS_BUCKET>/<DEMO_PREFIX>/devenv/inbox/
              LocalPath: /opt/ml/processing/inbox
              S3DataType: S3Prefix
              S3InputMode: File
              S3DataDistributionType: FullyReplicated
        ProcessingOutputConfig:
          Outputs:
            - OutputName: outbox
              S3Output:
                S3Uri: >-
                  s3://<PROJECTS_BUCKET>/<DEMO_PREFIX>/devenv/outbox/{{
                  macros.time.strftime('%Y%m%dT%H%M%S', macros.time.gmtime())
                  }}/
                LocalPath: /opt/ml/processing/outbox
                S3UploadMode: EndOfJob
          KmsKeyId: >-
            arn:aws:kms:<REGION>:<SANDBOX_ACCOUNT_ID>:key/<PROJECT_KEY_ID>
        AppSpecification:
          ImageUri: >-
            <REGISTRY_ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/awsds-prod-ecr-dev-env@<IMAGE_DIGEST>
          ContainerEntrypoint:
            - /bin/bash
            - "-c"
          ContainerArguments:
            - >-
              sudo -n chown "$(id -u)" /opt/ml/processing/outbox && exec
              /opt/awsds/venv/bin/python -m awsds_demo_job --input
              /opt/ml/processing/inbox --output /opt/ml/processing/outbox
        ProcessingResources:
          ClusterConfig:
            InstanceType: ml.t3.medium
            InstanceCount: 1
            VolumeSizeInGB: 10
            VolumeKmsKeyId: >-
              arn:aws:kms:<REGION>:<SANDBOX_ACCOUNT_ID>:key/<PROJECT_KEY_ID>
        RoleArn: >-
          arn:aws:iam::<SANDBOX_ACCOUNT_ID>:role/<PROJECT_ROLE_NAME>
        StoppingCondition:
          MaxRuntimeInSeconds: 1800
        Environment:
          PYTHONPATH: /opt/ml/processing/code/src
        NetworkConfig:
          EnableNetworkIsolation: true
          EnableInterContainerTrafficEncryption: true
          VpcConfig:
            Subnets:
              - <SUBNET_AZ1>
              - <SUBNET_AZ2>
            SecurityGroupIds:
              - <PROJECT_SG>
        Tags:
          - Key: AmazonDataZoneProject
            Value: <PROJECT_ID>
    remove_source:
      dependencies:
        - run_project
      operator: airflow.providers.amazon.aws.operators.s3.S3DeleteObjectsOperator
      bucket: <PROJECTS_BUCKET>
      prefix: >-
        <DEMO_PREFIX>/devenv/inbox/
      retries: 0

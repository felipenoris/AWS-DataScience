# The uv project behind every Python script in this repository (aws/, scripts/,
# terraform-live/identity/org-policies/, aws/probes/).
#
# Each script is executable and carries the shebang `#!/usr/bin/env -S uv run --quiet`: uv resolves
# this project, pins the interpreter to .python-version, installs the three packages below editable
# and runs the script in that environment. Nothing is installed globally; there is no activation step.
#
# requires-python is 3.9 while .python-version pins 3.14: CloudShell has no uv, and its fallback is
# the system interpreter (`python3 aws/<script>.py -`), 3.9 on Amazon Linux 2023. Raising the floor
# means checking what CloudShell ships first.
#
# Zero runtime dependencies: the standard library plus the aws CLI as a subprocess, which keeps the
# CloudShell fallback a one-liner and `uv sync` instant. ruff is a dev tool, not a dependency.

[project]
name = "awsds-tools"
version = "0.1.0"
description = "Read-only AWS snapshot scripts and repository hygiene checks for AWS-DataScience"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.12",
]

# The three packages, each next to the scripts it serves so that the script's own directory puts it
# on sys.path even without uv (the CloudShell case):
#
#   aws/awslib           shared plumbing for the aws/ snapshot scripts: repo/output location, aws
#                        CLI subprocess wrapper, report writer, profile preflight, CIDR math,
#                        policy-document entries
#   scripts/repohygiene  project files: markdown links, stable IDs, size budgets. Imports nothing
#                        from the other two, touches no AWS
#   scripts/tfhygiene    Terraform files: convention greps, IAM wildcard walk, backend.hcl
#                        generation, the authored attachments map. Same independence
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aws/awslib", "scripts/repohygiene", "scripts/tfhygiene"]

[tool.ruff]
line-length = 100
# The floor CloudShell imposes, not the pinned interpreter - ruff flags syntax above it.
target-version = "py39"
extend-exclude = [".venv", "terraform-live", "terraform-modules"]
# Honour the excludes even for files passed explicitly on the command line. pre-commit
# invokes ruff with the staged filenames as arguments, and without this the format
# exclusion below is silently ignored exactly there - `ruff format --check .` passes while
# the commit gate fails on aws/probes/probes.py.
force-exclude = true

[tool.ruff.lint]
# An explicit select, so a ruff upgrade cannot widen the gate silently: pycodestyle errors,
# pyflakes, warnings, import order, and pyupgrade (whose 3.10+ rewrites stay legal under
# `from __future__ import annotations`, which every module carries). No docstring or annotation
# policing: the scripts are reports, not an API surface.
select = ["E4", "E7", "E9", "F", "W", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
# The battery-as-data file keeps its own compact one-probe-per-block layout: exploding each
# argv onto fifteen lines is tidier for code and worse for a file people edit as a table.
exclude = ["aws/probes/probes.py"]

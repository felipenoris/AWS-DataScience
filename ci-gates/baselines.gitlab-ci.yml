# baselines.gitlab-ci.yml - the findings each image lineage and each uv project carries with a person's
# acceptance. The scan gate in gates.gitlab-ci.yml lists each CRITICAL or HIGH finding whose key is absent
# from its lineage's list, for the operator, and blocks nothing (Stage 8 decision 1); the pip-audit gate
# blocks on a vulnerability with a fixed version unless the project's list names it (decision 15). A
# pipeline includes this file beside that one, at the same commit, so a rule and the findings it admits
# move together.
#
# A line is `<finding>|<package>`, the key the gate compares. What follows `#` is for the reader: the
# severity and the package version the scan read, which a rebuild may move without changing the key. A
# finding enters a list by name, in a reviewed commit that says who accepted it; a finding a later release
# no longer carries is printed by the gate as no longer found, and leaves the list in the next commit.

.gates-baselines:
  variables:
    # The SageMaker Distribution lineage: awsds-prod-ecr-base, -dev-env and every application repository,
    # since each application image is FROM base. Seeded from default-v0.6.0 (SageMaker Distribution
    # 4.5.2-cpu), the release the steward last approved, registered as Sandbox's image version 6 at Stage 7
    # step 2.6: scanned 2026-10-12, CRITICAL 0 and HIGH 130, identical in base and dev-env. 121 of the 130
    # are linux-libc-dev, the kernel headers the distribution's build-essential pulls in; a container runs
    # its host's kernel, never these.
    GATES_BASELINE_SAGEMAKER_DISTRIBUTION: |
